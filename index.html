<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Diary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <iframe id="gas-iframe" name="gas-iframe" style="display:none;"></iframe>

    <div id="app" class="app-container">
        
        <!-- PAGE: LOGIN (PIN) -->
        <section id="page-login" class="page active">
            <div class="login-card">
                <div class="login-header">
                    <h2>Personal Diary</h2>
                    <p>Write freely. Keep your voice. Let AI refine your words.</p>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="password">PIN Akses</label>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="Masukkan PIN rahasia">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="login-btn">Masuk</button>
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>
        </section>

        <!-- MAIN APP LAYOUT -->
        <div id="main-layout" class="main-layout hidden">
            
            <header class="app-header">
                <div class="header-left">
                    <h1 class="logo">DiaryKu</h1>
                    <span id="user-greeting" class="greeting">Halo, Hussain</span>
                </div>
                <div class="header-right">
                    <button class="icon-btn" onclick="toggleTheme()" title="Ganti Tema">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                    <button class="icon-btn" onclick="switchPage('settings')" title="Pengaturan">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </header>

            <main class="app-content">
                <!-- DASHBOARD -->
                <section id="page-dashboard" class="sub-page active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-value" id="stat-total">0</span>
                            <span class="stat-label">Total Diary</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="stat-month">0</span>
                            <span class="stat-label">Bulan Ini</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="stat-streak">1 🔥</span>
                            <span class="stat-label">Streak</span>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <button class="btn btn-primary btn-lg" onclick="openNewEditor()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Tulis Diary Baru
                        </button>
                    </div>

                    <div class="section-header">
                        <h3>Diary Terbaru</h3>
                        <button class="text-btn" onclick="switchPage('history')">Lihat Semua</button>
                    </div>
                    <div id="recent-list" class="diary-list"></div>
                </section>

                <!-- EDITOR -->
                <section id="page-editor" class="sub-page">
                    <div class="editor-header-bar">
                        <button class="icon-btn" onclick="switchPage('dashboard')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        </button>
                        <div class="editor-status" id="save-status">Semua perubahan tersimpan</div>
                        <button class="btn btn-sm btn-primary" onclick="saveDiary()">Simpan</button>
                    </div>

                    <div class="editor-form">
                        <input type="hidden" id="edit-diary-id">
                        <div class="editor-meta-row">
                            <input type="date" id="diary-date" class="input-date">
                            <select id="diary-mood" class="input-mood">
                                <option value="neutral">😐 Netral</option>
                                <option value="happy">😊 Senang</option>
                                <option value="excited">🤩 Semangat</option>
                                <option value="calm">😌 Tenang</option>
                                <option value="grateful">🙏 Bersyukur</option>
                                <option value="sad">😢 Sedih</option>
                                <option value="tired">🥱 Lelah</option>
                                <option value="anxious">😰 Cemas</option>
                                <option value="angry">😡 Marah</option>
                            </select>
                        </div>

                        <input type="text" id="diary-title" class="input-title" placeholder="Judul cerita hari ini...">

                        <div class="textarea-container">
                            <textarea id="diary-content" placeholder="Tuliskan apa saja yang kamu rasakan atau alami hari ini secara bebas..." oninput="handleEditorInput()"></textarea>
                        </div>

                        <div class="editor-toolbar">
                            <div class="counters">
                                <span id="word-count">0 kata</span> • <span id="char-count">0 karakter</span>
                            </div>
                            <button type="button" class="btn btn-ai" onclick="requestAiCorrection()">
                                ✨ Koreksi Natural EYD (AI)
                            </button>
                        </div>
                    </div>
                </section>

                <!-- HISTORY -->
                <section id="page-history" class="sub-page">
                    <div id="history-list" class="diary-list"></div>
                </section>

                <!-- SETTINGS -->
                <section id="page-settings" class="sub-page">
                    <div class="settings-card">
                        <h3>Pengaturan</h3>
                        <div class="setting-item">
                            <span>Status</span>
                            <strong>Terautentikasi (PIN)</strong>
                        </div>
                        <hr>
                        <button class="btn btn-danger btn-block" onclick="handleLogout()">Keluar (Logout)</button>
                    </div>
                </section>
            </main>

            <nav class="bottom-nav">
                <button class="nav-item active" onclick="switchPage('dashboard')">
                    <span>Beranda</span>
                </button>
                <button class="nav-item" onclick="switchPage('history')">
                    <span>Riwayat</span>
                </button>
                <button class="nav-item" onclick="switchPage('settings')">
                    <span>Profil</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- AI MODAL -->
    <div id="ai-modal" class="modal hidden">
        <div class="modal-content">
            <h3>✨ Koreksi Natural EYD (Gemini AI)</h3>
            <div class="comparison-container">
                <div class="compare-box">
                    <strong>Asli</strong>
                    <div id="ai-orig-preview" class="compare-text"></div>
                </div>
                <div class="compare-box">
                    <strong>Hasil Koreksi AI</strong>
                    <div id="ai-corr-preview" class="compare-text"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAiModal()">Batalkan</button>
                <button class="btn btn-primary" onclick="applyAiCorrection()">Terapkan Hasil</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
